jobs:
  backend-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        working-directory: apps/backend
        run: npm ci

      - name: Lint
        working-directory: apps/backend
        run: npm run lint

      - name: Build
        working-directory: apps/backend
        run: npm run build
