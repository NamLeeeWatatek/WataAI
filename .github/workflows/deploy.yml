name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Check for changes
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.prod.yml'
              - '.github/workflows/deploy.yml'
            web:
              - 'web/**'
              - 'docker-compose.prod.yml'
              - '.github/workflows/deploy.yml'

  # 2. Build Backend (Only if changed)
  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Downcase REPO
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          # Tag with both 'latest' and commit sha
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Build Web (Only if changed)
  build-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Downcase REPO
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_FRONTEND_URL=${{ secrets.NEXT_PUBLIC_FRONTEND_URL }}
          push: true
          # Tag with both 'latest' and commit sha
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/web:latest
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 4. Deploy
  deploy:
    needs: [changes, build-backend, build-web]
    if: always() # Run even if one build info was skipped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine Tags
        id: tags
        run: |
          # If backend built (changed), use SHA. Else use latest.
          if [[ "${{ needs.changes.outputs.backend }}" == "true" ]]; then
            echo "BACKEND_TAG=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "Backend changed, using SHA: ${{ github.sha }}"
          else
            echo "BACKEND_TAG=latest" >> $GITHUB_OUTPUT
            echo "Backend unchanged, using latest"
          fi
          
          # If web built (changed), use SHA. Else use latest.
          if [[ "${{ needs.changes.outputs.web }}" == "true" ]]; then
            echo "WEB_TAG=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "Web changed, using SHA: ${{ github.sha }}"
          else
            echo "WEB_TAG=latest" >> $GITHUB_OUTPUT
            echo "Web unchanged, using latest"
          fi

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "docker-compose.prod.yml"
          target: "/var/www/watagroup"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        env:
          BACKEND_TAG: ${{ steps.tags.outputs.BACKEND_TAG }}
          WEB_TAG: ${{ steps.tags.outputs.WEB_TAG }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: BACKEND_TAG,WEB_TAG
          script: |
            cd /var/www/watagroup
            
            # Ensure images are pulled using the correct tags
            export BACKEND_TAG=${BACKEND_TAG}
            export WEB_TAG=${WEB_TAG}
            
            echo "------------------------------------------"
            echo "🚀 Starting Deployment"
            echo "📦 Backend Tag: $BACKEND_TAG"
            echo "📦 Web Tag: $WEB_TAG"
            echo "------------------------------------------"

            # Login to GHCR (GitHub Container Registry)
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Force pull the exact images defined in the compose file
            BACKEND_TAG=$BACKEND_TAG WEB_TAG=$WEB_TAG docker compose -f docker-compose.prod.yml pull

            # Update the services
            # --force-recreate: Bắt buộc tạo lại container ngay cả khi tag image ko đổi (nếu dùng latest)
            # --remove-orphans: Xóa bỏ các container ko còn định nghĩa trong file compose
            BACKEND_TAG=$BACKEND_TAG WEB_TAG=$WEB_TAG docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate

            # Cleanup: Xóa các image "dangling" (image cũ ko còn dùng) để tránh đầy ổ cứng
            docker image prune -f
            
            echo "✅ Deployment successful!"
