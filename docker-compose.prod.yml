version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: ${IMAGE_PREFIX}/backend:latest
    container_name: aiwata-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      # If you want to run DB on Host, uncomment extra_hosts below and set DATABASE_HOST=host.docker.internal in .env
      # If you want to run DB in Docker (infra-shared), set DATABASE_HOST=postgres in .env
      - NODE_ENV=production
    ports:
      - "8000:8000"
    networks:
      - wata-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 1G

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL}

    image: ${IMAGE_PREFIX}/web:latest
    container_name: aiwata-web
    restart: unless-stopped
    env_file:
      - web/.env
    ports:
      - "3001:3000"
    networks:
      - wata-network
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  wata-network:
    external: true
