version: "3.8"

services:
  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/namleeewatatek/wataai}/backend:${BACKEND_TAG:-latest}
    container_name: aiwata-backend
    restart: unless-stopped
    env_file:
      - backend/.env
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "8000:8000"
    networks:
      - wata-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 1G

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/namleeewatatek/wataai}/web:${WEB_TAG:-latest}
    container_name: aiwata-web
    restart: unless-stopped
    env_file:
      - web/.env
      - .env
    ports:
      - "3001:3000"
    networks:
      - wata-network
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  wata-network:
    external: true
